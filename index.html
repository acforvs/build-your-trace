      <section class="primer-shell">
        <div class="trace-primer wrap">
          <div class="primer-intro">
            <p class="eyebrow">A quick note on traces</p>
            <h2>What is a training trace?</h2>
            <p>When you profile a training run, you record the work done by the CPU and GPUs and how long it takes. That includes kernel launches, GPU kernels, memory copies, collectives, and synchronization.</p>
            <p>A trace lays those events out over time. Each row represents an execution context, such as a CUDA compute stream or communication stream. Reading from left to right shows what ran, what waited, and what overlapped.</p>
          </div>
          <div class="primer-concepts">
            <article><span>Block</span><p>A rectangle represents one operation or a small group of operations. Its position shows when it started; its width shows how long it ran.</p></article>
            <article><span>Dependency</span><p>Operations do not run just because they appear next in the Python code. They wait for their inputs, parameters, and any required communication.</p></article>
            <article><span>Overlap</span><p>Work on separate streams may run at the same time. If communication continues after useful compute ends, it remains on the critical path.</p></article>
          </div>
          <p class="primer-goal">Place operations in the order they can run. Work out what is ready, what is waiting, and what can overlap.</p>
        </div>
      </section>
